%YAML:1.0

#--------------------------------------------------------------------------------------------
# Camera Parameters for RealSense D405 (RGB-D mode)
# Note: These are approximate values based on D435i.
# For accurate results, calibrate your specific camera.
#--------------------------------------------------------------------------------------------
File.version: "1.0"

Camera.type: "PinHole"

# Camera calibration parameters (OpenCV)
# D405 intrinsics at 640x480 resolution (from camera_info topic)
Camera1.fx: 391.305
Camera1.fy: 390.776
Camera1.cx: 323.015
Camera1.cy: 242.630

# Distortion parameters
Camera1.k1: -0.0538
Camera1.k2: 0.0614
Camera1.p1: -0.0005
Camera1.p2: 0.0008

# Camera resolution
Camera.width: 640
Camera.height: 480

# Camera frames per second
Camera.fps: 30

# Color order of the images (0: BGR, 1: RGB. It is ignored if images are grayscale)
Camera.RGB: 1

#--------------------------------------------------------------------------------------------
# RGB-D Specific Parameters
#--------------------------------------------------------------------------------------------
# RGB-D/Stereo Parameters
#--------------------------------------------------------------------------------------------
# Stereo baseline in meters (D405 has ~18mm baseline)
Stereo.b: 0.018

# Stereo baseline times fx
# Camera.bf = baseline(m) * fx = 0.018 * 391.305 = 7.043
Camera.bf: 7.043

# Close/Far Depth threshold. Baseline times.
# Points seen with depth < ThDepth * baseline will be treated as close points
# D405 근거리 최적화: 30 * 0.018m = 0.54m
Stereo.ThDepth: 50.0

# Depth map factor (to convert depth values to meters)
# RealSense provides depth in millimeters (16-bit)
# ORB-SLAM3 calculates: mDepthMapFactor = 1/DepthMapFactor = 1/1000 = 0.001
# Then applies: depth_meters = depth_mm * 0.001
RGBD.DepthMapFactor: 1000.0

# Minimum depth threshold to filter close objects (e.g., robot gripper)
# Features closer than this distance (in meters) will be ignored
# Set to 0.0 to disable filtering
RGBD.MinDepth: 0.25

#--------------------------------------------------------------------------------------------
# ORB Parameters
#--------------------------------------------------------------------------------------------
# ORB Extractor: Number of features per image
# 품질 향상을 위해 1000 → 2000 증가
ORBextractor.nFeatures: 2000

# ORB Extractor: Scale factor between levels in the scale pyramid
ORBextractor.scaleFactor: 1.2

# ORB Extractor: Number of levels in the scale pyramid
# 스케일 불변성 향상을 위해 8 → 10 증가
ORBextractor.nLevels: 10

# ORB Extractor: Fast threshold
# Image is divided in a grid. At each cell FAST are extracted imposing a minimum response.
# Firstly we impose iniThFAST. If no corners are detected we impose a lower value minThFAST
# D405 실내 환경용으로 임계값 낮춤 (더 많은 특징점 검출)
ORBextractor.iniThFAST: 15
ORBextractor.minThFAST: 5

#--------------------------------------------------------------------------------------------
# Viewer Parameters
#--------------------------------------------------------------------------------------------
Viewer.KeyFrameSize: 0.05
Viewer.KeyFrameLineWidth: 1.0
Viewer.GraphLineWidth: 0.9
Viewer.PointSize: 2.0
Viewer.CameraSize: 0.08
Viewer.CameraLineWidth: 3.0
Viewer.ViewpointX: 0.0
Viewer.ViewpointY: -0.7
Viewer.ViewpointZ: -1.8
Viewer.ViewpointF: 500.0
